name: Download Cache

on:
  workflow_dispatch:

jobs:
  download-cache:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: temp-key
          restore-keys: |
            prefix-state-

      - name: Check restored files
        run: |
          echo "Cache hit: ${{ steps.cache.outputs.cache-hit }}"
          echo "Matched key: ${{ steps.cache.outputs.cache-primary-key }}"
          pwd
          ls -lah
          ls -lahR cache || true
          du -sh cache || true

      - name: Upload restored cache
        uses: actions/upload-artifact@v4
        with:
          name: restored-cache
          path: cache
          if-no-files-found: warn
